name: TDCanvas Desktop Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: 打包目标
        required: true
        default: all
        type: choice
        options:
          - windows
          - macos
          - all

permissions:
  contents: read

jobs:
  windows:
    if: inputs.target == 'windows' || inputs.target == 'all'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    env:
      TDCANVAS_UPDATER_ENDPOINT: ${{ secrets.TDCANVAS_UPDATER_ENDPOINT }}
      TDCANVAS_UPDATER_PUBLIC_KEY: ${{ secrets.TDCANVAS_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --legacy-peer-deps
      - run: npm run desktop:package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: TDCanvas-Windows
          path: |
            web/src-tauri/target/release/bundle/nsis/*.exe
            web/src-tauri/target/release/bundle/nsis/*.zip
            web/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  macos:
    if: inputs.target == 'macos' || inputs.target == 'all'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    env:
      TDCANVAS_UPDATER_ENDPOINT: ${{ secrets.TDCANVAS_UPDATER_ENDPOINT }}
      TDCANVAS_UPDATER_PUBLIC_KEY: ${{ secrets.TDCANVAS_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci --legacy-peer-deps
      - run: npm run desktop:package:macos
      - uses: actions/upload-artifact@v4
        with:
          name: TDCanvas-macOS
          path: |
            web/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            web/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            web/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            web/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig
          if-no-files-found: error
